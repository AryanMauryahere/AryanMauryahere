<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">GitHub statistics for AryanMauryahere</title>
  <desc id="desc">A dashboard showing contributions, streaks, contribution activity, and repository languages.</desc>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .label{fill:#8b94b3;font-size:15px}
    .value{fill:#e8ecf8;font-size:54px;font-weight:800}
    .small{fill:#8b94b3;font-size:12px}
    .card{fill:#ffffff;fill-opacity:.045;stroke:#ffffff;stroke-opacity:.1}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
    .bar:nth-of-type(2){animation-delay:.05s}.bar:nth-of-type(3){animation-delay:.1s}
    .bar:nth-of-type(4){animation-delay:.15s}.bar:nth-of-type(5){animation-delay:.2s}
    .bar:nth-of-type(6){animation-delay:.25s}.bar:nth-of-type(7){animation-delay:.3s}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.bar{animation:none}}
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#0f1530"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx=".12" cy=".05" r=".55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx=".92" cy=".98" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".055"/>
    </pattern>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b9bff"/>
      <stop offset="1" stop-color="#4338ca" stop-opacity=".75"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="800" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="800" fill="url(#background)"/>
    <rect width="1200" height="800" fill="url(#dots)"/>
    <rect width="1200" height="800" fill="url(#purpleGlow)"/>
    <rect width="1200" height="800" fill="url(#cyanGlow)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="799" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/>

  <text x="40" y="55" fill="#e8ecf8" font-size="28" font-weight="800">GitHub stats</text>
  <text x="40" y="80" fill="#8b94b3" font-size="14">Aryan Maurya, Full-Stack Developer</text>

  <rect class="card" x="40" y="105" width="300" height="190" rx="20"/>
  <text class="label" x="68" y="148">Total contributions</text>
  <text class="value" x="68" y="222">0</text>
  <text class="small" x="68" y="250">Updated by GitHub Actions</text>

  <rect class="card" x="360" y="105" width="480" height="190" rx="20"/>
  <text class="label" x="390" y="148">Current streak</text>
  <circle cx="600" cy="205" r="65" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="12"/>
  <circle id="current-ring" cx="600" cy="205" r="65" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 600 205)" stroke-dasharray="0 408.4"/>
  <text id="current-streak" x="600" y="211" text-anchor="middle" fill="#e8ecf8" font-size="38" font-weight="800">0</text>
  <text x="600" y="236" text-anchor="middle" class="small">days</text>
  <text class="label" x="685" y="198">Longest streak</text>
  <text id="longest-streak" x="685" y="250" class="value">0</text>

  <rect class="card" x="860" y="105" width="300" height="190" rx="20"/>
  <text class="label" x="888" y="148">Repositories</text>
  <text id="repo-count" x="888" y="222" class="value">0</text>
  <text class="small" x="888" y="250">Public repositories</text>

  <text class="label" x="40" y="340">Contributions by weekday</text>
  <text class="small" x="1080" y="340" text-anchor="end">Last year</text>
  <line x1="40" y1="560" x2="1160" y2="560" stroke="#ffffff" stroke-opacity=".1"/>
  <g id="weekday-bars" fill="url(#barFill)"></g>
  <g fill="#8b94b3" font-size="12" text-anchor="middle">
    <text x="120" y="585">Sun</text><text x="280" y="585">Mon</text>
    <text x="440" y="585">Tue</text><text x="600" y="585">Wed</text>
    <text x="760" y="585">Thu</text><text x="920" y="585">Fri</text>
    <text x="1080" y="585">Sat</text>
  </g>

  <rect class="card" x="40" y="620" width="540" height="140" rx="20"/>
  <text class="label" x="68" y="658">Top languages by repository</text>
  <g id="repo-languages"></g>
  <rect class="card" x="600" y="620" width="560" height="140" rx="20"/>
  <text class="label" x="628" y="658">Contribution summary</text>
  <text id="summary" x="628" y="700" fill="#e8ecf8" font-size="16">Loading GitHub data...</text>
  <text x="628" y="728" class="small">Generated from the GitHub GraphQL API</text>
</svg>
